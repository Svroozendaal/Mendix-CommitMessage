name: Build Browser Artifact

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish standalone (self-contained, win-x64)
        run: >
          dotnet publish standalone/
          -c Release
          -r win-x64
          --self-contained true
          -o ./artifact/app
          --nologo
          -v quiet

      - name: Copy distribution files
        shell: pwsh
        run: |
          Copy-Item .env.example        ./artifact/.env.example
          Copy-Item Start-AutoCommitMessage.bat ./artifact/Start-AutoCommitMessage.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCommitMessage-browser
          path: ./artifact/
          retention-days: 30
